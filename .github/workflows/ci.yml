name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check links and images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify every local link and image exists
        run: python tools/check_links.py

      - name: Verify every chapter is linked from the index
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          index = (root / "index.html").read_text(encoding="utf-8")
          chapters = [
              p.name for p in root.iterdir()
              if p.is_dir() and (p / "index.html").exists()
              and not p.name.startswith(".") and p.name != "assets"
          ]
          missing = [c for c in chapters if f"{c}/index.html" not in index]
          print("chapters:", len(chapters))
          if missing:
              print("NOT linked from index.html:", missing)
              sys.exit(1)
          print("OK: every chapter is linked from index.html")
          PY
